<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>情绪歌曲推荐</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:#1a1a2e;color:#fff;padding:30px;font-family:system-ui}
        h1{text-align:center;margin-bottom:30px;color:#87cefa}
        .box{max-width:1000px;margin:0 auto}
        .emo-tab{display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap}
        .emo-tab button{padding:10px 18px;border:none;border-radius:8px;background:#16213e;color:#fff;font-size:16px;cursor:pointer}
        .emo-tab button.active{background:#0f3460}
        .song-list{display:grid;grid-template-columns: repeat(auto-fill,minmax(220px,1fr));gap:16px}
        .song-item{background:#16213e;padding:16px;border-radius:10px}
        .song-item h3{margin-bottom:6px;font-size:18px}
        .song-item p{color:#aaa;font-size:14px}
    </style>
</head>
<body>
    <div class="box">
        <h1>情绪歌曲推荐｜wangyiwei 20261028</h1>
        <div class="emo-tab">
            <button data-type="happy">开心</button>
            <button data-type="sad">难过</button>
            <button data-type="heal">治愈</button>
        </div>
        <div class="song-list" id="list"></div>
    </div>
<script src="music.js"></script>
</body>
</html>
